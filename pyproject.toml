[project]
name = "mentor-bot"
version = "0.1.0"
description = "Telegram bot for testing theoretical Python knowledge"
readme = "README.md"
authors = [
    { name = "Igor39-dev", email = "19gorokhov90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "langchain>=0.3.18",
    "langchain-openai>=0.2.14",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[project.scripts]
mentor-bot = "mentor_bot.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
