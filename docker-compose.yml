services:
  postgres:
    image: postgres:16
    container_name: python_theory_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: python_theory_bot_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
